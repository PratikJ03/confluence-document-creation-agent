services:
  document-creation-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: confluence-document-agent
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Mount the Atlassian OAuth token cache read/write because the OAuth
      # exchange persists access and refresh tokens here.
      - ${USERPROFILE}/.atlassian-mcp-auth:/home/appuser/.atlassian-mcp-auth
    restart: unless-stopped

